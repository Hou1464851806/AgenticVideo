spring.application.name=agenticvideo
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:54328/agenticvideo}
spring.datasource.username=${DATABASE_USER:agenticvideo}
spring.datasource.password=${DATABASE_PASSWORD}
spring.session.jdbc.initialize-schema=never
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=1KB
spring.servlet.multipart.max-request-size=1KB
server.error.include-message=never
app.storage.endpoint=${S3_ENDPOINT:http://localhost:19000}
app.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:19000}
app.storage.access-key=${S3_ACCESS_KEY}
app.storage.secret-key=${S3_SECRET_KEY}
app.storage.bucket=${S3_BUCKET:agenticvideo}
app.storage.region=us-east-1
spring.flyway.schemas=business_schema
spring.flyway.default-schema=business_schema
spring.datasource.hikari.connection-init-sql=SET search_path TO business_schema
spring.session.jdbc.table-name=business_schema.spring_session
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.timeout=30m
server.tomcat.max-http-form-post-size=1MB
app.mode=${APP_MODE:api}
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
server.tomcat.connection-timeout=15s
