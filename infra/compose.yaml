name: agenticvideo
x-backend: &backend
  image: agenticvideo-backend:local
  build:
    context: ..
    dockerfile: backend/Dockerfile
  init: true
  environment: &app-environment
    DATABASE_URL: jdbc:postgresql://postgres:5432/agenticvideo
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    S3_ENDPOINT: http://silo:9000
    S3_PUBLIC_ENDPOINT: http://localhost:${SILO_PORT:-19000}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    COOKIE_SECURE: "false"
    APP_STORAGE_SIGNATURE_TTL_SECONDS: ${UPLOAD_SIGNATURE_TTL_SECONDS:-300}
  depends_on:
    postgres: {condition: service_healthy}
    silo-init: {condition: service_completed_successfully}
  restart: unless-stopped
  pids_limit: 256
services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: agenticvideo
      POSTGRES_USER: agenticvideo
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    ports: ["127.0.0.1:${DATABASE_PORT:-54328}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticvideo"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?set SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?set SILO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${BROWSER_ORIGIN:-http://localhost:5173}
    ports: ["127.0.0.1:${SILO_PORT:-19000}:9000", "127.0.0.1:${SILO_CONSOLE_PORT:-19001}:9001"]
    volumes: ["silo:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  silo-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    entrypoint: ["/bin/sh", "/config/silo-init.sh"]
    environment:
      SILO_ROOT_USER: ${SILO_ROOT_USER:?set SILO_ROOT_USER}
      SILO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?set SILO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes: ["./silo-init.sh:/config/silo-init.sh:ro", "./silo-policy.json:/config/silo-policy.json:ro"]
    depends_on:
      silo: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    <<: *backend
    command: ["--spring.main.web-application-type=none"]
    environment:
      <<: *app-environment
      APP_MODE: worker
      APP_WORKER_DIRECTORY: /work
      APP_LIMITS_ASSET_DURATION_MS: ${ASSET_DURATION_MS:-7200000}
      APP_LIMITS_PROJECT_DURATION_MS: ${PROJECT_DURATION_MS:-10800000}
      APP_WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      APP_WORKER_DISK_BYTES: ${WORKER_DISK_BYTES:-32000000000}
      APP_WORKER_RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-1800}
      APP_WORKER_CLEANUP_TTL_SECONDS: ${CLEANUP_TTL_SECONDS:-3600}
      MEDIA_STDERR_BYTES: ${MEDIA_STDERR_BYTES:-8192}
    volumes: ["worker-scratch:/work"]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 10s
  frontend:
    image: agenticvideo-frontend:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  silo:
  worker-scratch:
